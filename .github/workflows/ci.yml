name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # There are pre-existing lint issues in the codebase (mostly `no-explicit-any`).
      # Kept non-blocking for now so CI stays a useful signal; make this blocking
      # once the backlog is cleaned up by dropping `continue-on-error`.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: https://medikalija-api.vercel.app
